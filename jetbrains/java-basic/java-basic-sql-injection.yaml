rules:
  - id: java-basic-sql-injection
    languages: [java]
    severity: WARNING
    message: Request data controls SQL text. Use a fixed query with bound parameters.
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
          - pattern: (jakarta.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
          - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getParameter(...)
          - pattern: (javax.servlet.http.HttpServletRequest $REQUEST).getHeader(...)
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: (java.sql.Statement $STATEMENT).execute($SQL, ...)
              - pattern: (java.sql.Statement $STATEMENT).executeQuery($SQL)
              - pattern: (java.sql.Statement $STATEMENT).executeUpdate($SQL, ...)
              - pattern: (java.sql.Connection $CONNECTION).prepareStatement($SQL, ...)
              - pattern: (java.sql.Connection $CONNECTION).prepareCall($SQL, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).query($SQL, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).queryForObject($SQL, ...)
              - pattern: (org.springframework.jdbc.core.JdbcTemplate $JDBC).update($SQL, ...)
          - focus-metavariable: $SQL
