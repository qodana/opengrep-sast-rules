rules:
  - id: javascript-reflected-xss
    metadata:
      shortDescription: "User input is reflected in an HTML response"
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A07:2017 - Cross-Site Scripting (XSS)"
        - "A03:2021 - Injection"
        - "A05:2025 - Injection"
    message: >-
      User-controlled input from an HTTP request is reflected in an HTML response,
      resulting in a reflected XSS vulnerability
    languages:
      - javascript
      - typescript
    severity: ERROR
    mode: taint

    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.body.$KEY
              - pattern: $REQ.query
              - pattern: $REQ.query.$KEY
              - pattern: $REQ.query[$KEY]
              - pattern: $REQ.params
              - pattern: $REQ.params.$KEY
              - pattern: $REQ.params[$KEY]
              - pattern: $REQ.url
              - pattern: $REQ.json()
          # A database call such as db.query(...) is not request data
          - pattern-not-inside:
              patterns:
                - pattern: $REQ.query(...)
                - metavariable-regex:
                    metavariable: $REQ
                    regex: '(?i)^(.*\.)?(db|database|conn|connection|pool|client|knex|sequelize|pg|mysql|sql)$'
          # A fetch response is not the request
          - pattern-not-inside: |
              $REQ = await fetch(...);
              ...

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($VALUE, ...)
              - pattern: $RES.end($VALUE, ...)
              - pattern: $RES.write($VALUE, ...)
              - pattern: $RES.status(...).send($VALUE, ...)
              - pattern: $RES.status(...).end($VALUE, ...)
          - pattern-inside:
              pattern-either:
                # A function pattern also matches an arrow function
                - pattern: |
                    $APP.$METHOD(..., function($REQ, $RES, ...) {
                      ...
                    })
                - pattern: |
                    function($REQ, $RES, $NEXT) {
                      ...
                    }
                - pattern: |
                    export default function $FUNC($REQ, $RES) {
                      ...
                    }
                - pattern: |
                    export async function $FUNC($CTX) {
                      ...
                      $RES = $CTX.res
                      ...
                    }
                - pattern: |
                    $PROP = async ($CTX) => {
                      ...
                      $RES = $CTX.res
                      ...
                    }
          # A plain text or JSON content type makes the response safe
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern: |
                        $RES.$SET($HEADER, $TYPE)
                        ...
                    - pattern: |
                        $RES.$SET({..., $HEADER: $TYPE, ...})
                        ...
                    - pattern: |
                        $RES.writeHead(..., {..., $HEADER: $TYPE, ...})
                        ...
                - metavariable-regex:
                    metavariable: $HEADER
                    regex: '(?i)^["'']?content-type["'']?$'
                - metavariable-regex:
                    metavariable: $TYPE
                    regex: '(?i)^(["'']?(text/plain|application/json)(;\s*charset=utf-?8)?["'']?|textContentType\(\))$'
          - focus-metavariable: $VALUE
      # A Response without an HTML content type is not HTML: a string body gets text/plain
      - patterns:
          - pattern-either:
              - pattern: |
                  new $RESPONSE($VALUE, {..., headers: {..., $HEADER: $TYPE, ...}, ...})
              - pattern: |
                  $HEADERS = new Headers({..., $HEADER: $TYPE, ...})
                  ...
                  new $RESPONSE($VALUE, {..., headers: $HEADERS, ...})
              - pattern: |
                  $HEADERS = new Headers(...)
                  ...
                  $HEADERS.$OP($HEADER, $TYPE)
                  ...
                  new $RESPONSE($VALUE, {..., headers: $HEADERS, ...})
          - metavariable-regex:
              metavariable: $RESPONSE
              regex: '^(Response|NextResponse)$'
          - metavariable-regex:
              metavariable: $HEADER
              regex: '(?i)^["'']?content-type["'']?$'
          - metavariable-regex:
              metavariable: $TYPE
              regex: '(?i)^["'']?(text/html|application/xhtml\+xml|image/svg\+xml)(;.*)?["'']?$'
          - pattern-inside:
              pattern-either:
                # A function pattern also matches an arrow function
                - pattern: |
                    $APP.$METHOD(..., function($REQ, ...) {
                      ...
                    })
                - pattern: |
                    export async function $FUNC($REQ) {
                      ...
                    }
                - pattern: |
                    export default function $FUNC($REQ, ...) {
                      ...
                    }
          - focus-metavariable: $VALUE

    pattern-sanitizers:
      # A comparison with a constant string limits the value in the matching branch
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if ($X == "...") $THEN;
              - pattern-inside: |
                  if ($X === "...") $THEN;
              # OpenGrep does not propagate a constant into a nested function
              - patterns:
                  - pattern-inside: |
                      const $CONST = "...";
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          if ($X == $CONST) $THEN;
                      - pattern-inside: |
                          if ($X === $CONST) $THEN;
          - focus-metavariable: $THEN
          - pattern: $X
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if ($X != "...") $THEN; else $ELSE;
              - pattern-inside: |
                  if ($X !== "...") $THEN; else $ELSE;
              - patterns:
                  - pattern-inside: |
                      const $CONST = "...";
                      ...
                  - pattern-either:
                      - pattern-inside: |
                          if ($X != $CONST) $THEN; else $ELSE;
                      - pattern-inside: |
                          if ($X !== $CONST) $THEN; else $ELSE;
          - focus-metavariable: $ELSE
          - pattern: $X
      - pattern-either:
          - pattern: $REQ.cookies[...]
          # console.log returns undefined. Only its result is safe, not its arguments.
          - patterns:
              - pattern: console.log(...)
              - pattern-inside: $FUNC(..., console.log(...), ...)
          # The file contents do not depend on the requested path
          - pattern: readFileSync(...)
          - pattern: $FS.readFileSync(...)
          - pattern: createReadStream(...)
          - pattern: $FS.createReadStream(...)
          # Match the call, not the await: a wider range also clears the call arguments
          - patterns:
              - pattern: $FS.readFile(...)
              - pattern-inside: await $FS.readFile(...)
          # The fetched server sends the response, not the client
          - pattern: fetch(...)
          # Handlebars escapes HTML in {{...}}. A {{{...}}} template or compile options can turn it off.
          - patterns:
              - pattern-inside: |
                  $HB = require("handlebars");
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $TEMPLATE = $HB.compile($SRC);
                      ...
                  - pattern-inside: |
                      function $INIT(...) {
                        ...
                        $TEMPLATE = $HB.compile($SRC);
                        ...
                      }
                      ...
              - pattern: $TEMPLATE(...)
              - metavariable-regex:
                  metavariable: $SRC
                  regex: '^(?!.*\{\{\{)'
          # A bound function is not request data, even when its bound arguments are
          - pattern: $FUNC.bind(...)
          - patterns:
              - pattern: $SERIALIZE(...)
              - pattern-not: '$SERIALIZE(..., {unsafe: true})'
              - pattern-inside: |
                  $SERIALIZE = require("serialize-javascript")
                  ...
          - patterns:
              - pattern: $REMARK().use($SANITIZE).$METHOD(...)
              - pattern-inside: |
                  $REMARK = require("remark")
                  ...
              - pattern-inside: |
                  $SANITIZE = require("rehype-sanitize")
                  ...
          - patterns:
              - pattern: $MARKDOWN.use($SANITIZE).$METHOD(...)
              - metavariable-pattern:
                  metavariable: $SANITIZE
                  pattern: require("markdown-it-sanitizer")
          - patterns:
              - pattern: $SAFE_MARKDOWN.render(...)
              - pattern-inside: |
                  $SAFE_MARKDOWN = require("markdown-it")($OPTIONS)
                  ...
              - metavariable-pattern:
                  metavariable: $OPTIONS
                  patterns:
                    - pattern-not: '{html: true}'
          - patterns:
              - pattern-either:
                  - pattern: $ESCAPE(...)
                  - pattern: $OBJ.$ESCAPE(...)
              - metavariable-regex:
                  metavariable: $ESCAPE
                  regex: '^(escape|encode).*$'

    pattern-propagators:
      # A function pattern also matches an arrow function
      - pattern: $PROCESS.process($INPUT, function ($ERR, $VALUE) { ... })
        from: $INPUT
        to: $VALUE
