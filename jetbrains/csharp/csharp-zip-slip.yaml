rules:
  - id: csharp-zip-slip
    metadata:
      shortDescription: "Entry path from an archive reaches a filesystem write API"
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A05:2017 - Broken Access Control"
        - "A01:2021 - Broken Access Control"
        - "A01:2025 - Broken Access Control"
    languages: [ csharp ]
    severity: ERROR
    message: >-
      Entry path from an archive reaches a filesystem write API, 
      leading to a ZipSlip vulnerability
    mode: taint

    pattern-sources:
      - patterns:
          - pattern: $ENTRY.FullName
          - pattern-inside: |
              foreach ($ENTRY in $ARCHIVE.Entries) {
                ...
              }
          - metavariable-type:
              metavariable: $ARCHIVE
              type: ZipArchive
      - patterns:
          - pattern: $ENTRY.$FIELD
          # See: https://learn.microsoft.com/en-us/dotnet/api/system.io.compression.ziparchiveentry?view=net-10.0#properties
          - metavariable-regex:
              metavariable: $FIELD
              regex: ^(FullName|Name)$
          - metavariable-type:
              metavariable: $ENTRY
              type: ZipArchiveEntry

    pattern-sanitizers:
      - pattern: Path.GetFileName($PATH)
      - pattern: Path.GetFileNameWithoutExtension($PATH)
      - pattern: $PATH.Substring($PATH.LastIndexOf("\\") + 1)
      - pattern: $PATH.Substring($PATH.LastIndexOf("/") + 1)
      - pattern: $PATH.Substring($PATH.LastIndexOf("\\"))
      - pattern: $PATH.Substring($PATH.LastIndexOf("/"))
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  if (!$PATH.StartsWith(...)) {
                    ...
                    throw ...;
                  }
                  ...
              - pattern-inside: |
                  if (!$PATH.StartsWith(...))
                    throw ...;
                  ...
              - pattern-inside: |
                  if (!$PATH.StartsWith(...)) {
                    ...
                    return ...;
                  }
                  ...
              - pattern-inside: |
                  if (!$PATH.StartsWith(...))
                    return ...;
                  ...
              - pattern-inside: |
                  if (!$PATH.StartsWith(...)) {
                    ...
                    return;
                  }
                  ...
              - pattern-inside: |
                  if (!$PATH.StartsWith(...))
                    return;
                  ...
          - pattern: $PATH
      - patterns:
          - pattern-either:
              - pattern: |
                  if ($PATH.StartsWith(...)) {
                    ...
                  }
              - pattern: |
                  if ($PATH.StartsWith(...))
                    ...
          - pattern-either:
              - pattern-inside: |
                  $PATH = Path.GetFullPath(...);
                  ...
              - pattern-inside: |
                  $TYPE $PATH = Path.GetFullPath(...);
                  ...
              - pattern-inside: |
                  var $PATH = Path.GetFullPath(...);
                  ...
          - focus-metavariable: $PATH
        by-side-effect: true

    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: $ENTRY.ExtractToFile($PATH, ...)
                  - pattern-inside: |
                      foreach ($ENTRY in $ARCHIVE.Entries) {
                        ...
                      }
                  - metavariable-type:
                      metavariable: $ARCHIVE
                      type: ZipArchive
              - patterns:
                  - pattern: $ENTRY.ExtractToFile($PATH, ...)
                  - metavariable-type:
                      metavariable: $ENTRY
                      type: ZipArchiveEntry
              - pattern: File.Create($PATH)
              - pattern: new FileInfo($PATH)
              - pattern: new FileStream($PATH, ...)
          - focus-metavariable: $PATH