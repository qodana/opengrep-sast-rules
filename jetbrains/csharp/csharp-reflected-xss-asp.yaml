rules:
  - id: csharp-reflected-xss-asp
    metadata:
      shortDescription: "User input reaches the HTML output context"
      category: security
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp:
        - "A07:2017 - Cross-Site Scripting (XSS)"
        - "A03:2021 - Injection"
        - "A05:2025 - Injection"
    languages: [ csharp ]
    severity: ERROR
    message: >-
      User-controlled input reaches the HTML output context, 
      resulting in a reflected XSS vulnerability
    mode: taint

    pattern-sources:
      - pattern-either:
          - patterns:
              - pattern: $BOX.Text
              - metavariable-type:
                  metavariable: $BOX
                  type: TextBox
          - patterns:
              - pattern-either:
                  - pattern: $CTX.Request[$KEY]
                  - pattern: $CTX.Request.QueryString[$KEY]
                  - pattern: $CTX.Request.Unvalidated.QueryString[$KEY]
              - metavariable-type:
                  metavariable: $CTX
                  types:
                    - HttpContext
                    - HttpContextBase
          - patterns:
              - pattern-either:
                  - pattern: Request[$KEY]
                  - pattern: Request.QueryString[$KEY]
                  - pattern: Request.Headers
          - patterns:
              - pattern-either:
                  - pattern: $BOX.Text
              - pattern-either:
                  - pattern-inside: |
                      class $PAGE : Page { ... }
                  - pattern-inside: |
                      class $PAGE : System.Web.UI.Page { ... }
          - pattern: System.Convert.FromBase64String($KEY)
          - pattern: $REQ.RawUrl

    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new HtmlString($VALUE)
              - pattern: new MvcHtmlString($VALUE)
              - pattern: new StringContent($VALUE)
              - patterns:
                  - pattern: $CTX.Response.Write($VALUE)
                  - metavariable-type:
                      metavariable: $CTX
                      types:
                        - HttpContext
                        - HttpContextBase
              - patterns:
                  - pattern: $HTML.Raw($VALUE)
                  - metavariable-type:
                      metavariable: $HTML
                      type: HtmlHelper
              - patterns:
                  - pattern: $TYPE.$FIELD = $VALUE
                  - metavariable-type:
                      metavariable: $TYPE
                      types:
                        - Calendar
                        - Table
                        - Label
              - patterns:
                  - pattern: $TEXTBOX.Text = $VALUE
                  - pattern-not: $TEXTBOX.Text = <... $TEXTBOX.Text ...>
                  - pattern-either:
                      - pattern-inside: |
                          class $PAGE : Page { ... }
                      - pattern-inside: |
                          class $PAGE : System.Web.UI.Page { ... }
          - focus-metavariable: $VALUE

    pattern-propagators:
      - pattern: $SB.AppendFormat($FORMAT, $VALUE)
        from: $VALUE
        to: $SB
      - pattern: (StringBuilder $B).$ANY(...+(string $X)+...)
        from: $X
        to: $B

    pattern-sanitizers:
      - pattern-either:
          - pattern: $ENCODER.HtmlEncode(...)
          - pattern: $ENCODER.UrlEncode(...)
          - pattern: int.Parse(...)
          - pattern: Server.MapPath(...)
          - pattern: Server.UrlEncode(...)
          - pattern: System.Convert.ToBase64String(...)
          - patterns:
              - pattern: $ENCRYPT(...)
              - metavariable-regex:
                  metavariable: $ENCRYPT
                  regex: (?i).*encrypt.*
      - patterns:
          - pattern-either:
              - pattern: Array.Reverse(...)
        by-side-effect: true